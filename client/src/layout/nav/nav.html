<header class="p-3 w-full fixed top-0 z-50 bg-gradient-to-r from-blue-600 to-black">
  <div class="flex items-center px-10 mx-auto gap-6">

    <!-- Logo Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-6 h-6 text-white" viewBox="0 0 24 24">
      <path d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z"/>
    </svg>

    <!-- Branding -->
    <a routerLink="/" routerLinkActive="text-black" class="flex items-center gap-3 max-h-16 text-white border-r-white border-r-2 pr-6">
      <h3 class="text-2xl font-semibold text-white uppercase">Dating app</h3>
    </a>

    <!-- Navigation -->
    <nav class="flex gap-3 my-2 uppercase text-lg text-white">
      @if(accountservice.currentUser()){
         <a routerLink="/members" routerLinkActive="text-black">Matches</a>
         <a routerLink="/lists" routerLinkActive="text-black">List</a>
         <a routerLink="/messages" routerLinkActive="text-black">Messages</a>
      }
               <a routerLink="/errors" routerLinkActive="text-accent">Errors</a>

      </nav>
     
    
    <!-- Right-aligned dropdown -->
    <div class="flex items-center ml-auto gap-3">
     @if(accountservice.currentUser())
     {
    <div class="dropdown">
        <button
          class="btn btn-primary dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false">
          Click
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">Edit Profile</a></li>
          <li><a (click)="logout()" class="dropdown-item" href="#">LogOut</a></li>
        </ul>
      </div>
     }@else {
    <form #loginForm="ngForm" (ngSubmit)="login()" class="flex items-center gap-3">
            <input [(ngModel)]="creds.email" name="email" type="text" class="input bg-amber-50" placeholder="Email">
            <input [(ngModel)]="creds.password" name="password" type="password" class="input bg-amber-50" placeholder="Password">
            <button class="bg-white text-black px-4 py-.9 rounded">Login</button>
    </form>
     }     
    </div>
  </div>
</header>
