<div class="card w-50 p-4 rounded shadow-lg mx-auto">
  <div class="card-header text-center text-primary fs-3 fw-bold">
    Sign up
  </div>
  <div class="card-body">
    <form #registerForm="ngForm" (ngSubmit)="register()">
      <div class="mb-3">
        <input type="text" class="form-control" name="email" [(ngModel)]="creds.email" placeholder="Email">
      </div>

      <div class="mb-3">
        <input type="text" class="form-control" name="displayName" [(ngModel)]="creds.displayName" placeholder="Display name">
      </div>

      <div class="mb-3">
        <input type="password" class="form-control" name="password" [(ngModel)]="creds.password" placeholder="Password">
      </div>

      <div class="d-flex justify-content-end gap-3">
        <button (click)="cancel()" type="button" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Register</button>
      </div>
    </form>
  </div>
</div>
