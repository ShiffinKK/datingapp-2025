<div class="bg-light min-vh-100 d-flex align-items-center justify-content-center text-center">
    @if(!registerMode())
    {
 <div class="container">
        <div class="d-flex flex-column align-items-center">
            <!-- Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="currentColor" class="text-primary mb-4" viewBox="0 0 24 24">
                <path d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z" />
            </svg>

            <!-- Headline -->
            <h1 class="display-4 fw-bold">Find your match</h1>
            <p class="lead my-4">Come on in.. all you need to do is sign up</p>

            <!-- Buttons -->
            <div class="d-flex justify-content-center gap-3">
                <a href="#" (click)="showRegister(true)" class="btn btn-primary btn-lg">Register</a>
                <a href="#" class="btn btn-info btn-lg text-white">Learn More</a>
            </div>
        </div>
    </div>
    }
    @else {
        <div class="w-full text2xl text-center flex justify-center">
            <app-register class="w-full" (cancelRegister)="showRegister($event)"/>
        </div>
    }
   
</div>
